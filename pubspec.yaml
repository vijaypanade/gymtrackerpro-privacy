name: gymtrackerpromaster
description: LiftOn - Premium AI Fitness App
publish_to: 'none'
version: 2.3.0+38

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase (UPDATED - IMPORTANT)
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.15.0
  firebase_crashlytics: ^3.5.7
  firebase_remote_config: ^4.4.7

  # 🔐 Google Sign-In
  google_sign_in: ^6.2.1

  # ── State Management ─────────────────────────
  provider: ^6.1.2

  # ── Storage ─────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Network ─────────────────────────────────
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # ── UI ──────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # ── Ads ─────────────────────────────────────
  google_mobile_ads: ^4.0.0

  # ── Utils ───────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  audioplayers: ^5.2.1

  # ── Billing ─────────────────────────────────
  in_app_purchase: ^3.1.13

  # ── Notifications ───────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  firebase_analytics: ^10.10.7
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.7
  health: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/header_logo.png
    - assets/splash.png
    - assets/sounds/success.mp3
    - assets/data/exercise_videos.json
    - assets/icons/
    - assets/icons/workouts/
    - assets/body/

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
flutter_native_splash:
  color: "#000000"
  image: assets/app_icon.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#000000"
    image: assets/app_icon.png


