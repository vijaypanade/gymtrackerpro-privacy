name: gymtrackerpromaster
description: GymTracker Pro - Premium AI Fitness App
publish_to: 'none'
version: 2.0.10+12

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase (UPDATED - IMPORTANT)
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.15.0
  firebase_crashlytics: ^3.5.0
  firebase_remote_config: ^4.4.7

  # 🔐 Google Sign-In
  google_sign_in: ^6.2.1

  # ── State Management ─────────────────────────
  provider: ^6.1.2

  # ── Storage ─────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Network ─────────────────────────────────
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # ── UI ──────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # ── Ads ─────────────────────────────────────
  google_mobile_ads: ^4.0.0

  # ── Utils ───────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  audioplayers: ^5.2.1

  # ── Billing ─────────────────────────────────
  in_app_purchase: ^3.1.13

  # ── Notifications ───────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/splash.png
    - assets/sounds/success.mp3

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon.png"